<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="RoundReady">
  <!--
    A ring with one segment cleared: the rounds of a placement season, with the
    one you are through marked. Drawn with currentColor-independent fills so it
    renders identically in a light or dark browser chrome.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0b0d10" />
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#2e333b" stroke-width="3.5" />
  <path
    d="M16 7.5a8.5 8.5 0 0 1 8.5 8.5"
    fill="none"
    stroke="#36c9e8"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <circle cx="16" cy="16" r="2.25" fill="#36c9e8" />
</svg>
